[package]
name = "og_testdesk_desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Passed through to og_testdesk_core for the Mac App Store build:
# `cargo tauri build --features app-store` (see docs/next-steps.md).
app-store = ["og_testdesk_core/app-store"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
og_testdesk_core = { path = "../core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
dirs-next = "2"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tokio-stream = "0.1"
futures-util = "0.3"
cron = "0.12"
sha2 = "0.10"
base64 = "0.22"

[[bin]]
name = "og_testdesk_desktop"
path = "src/main.rs"
