name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (workspace)
        run: cargo check --workspace --all-targets

      - name: cargo test (workspace)
        run: cargo test --workspace

      - name: cargo clippy (informational — not a merge gate yet)
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

      - name: cargo fmt --check (informational — not a merge gate yet)
        run: cargo fmt --all -- --check
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: svelte-check (informational — pre-existing implicit-any noise, not a merge gate yet)
        run: pnpm run check
        continue-on-error: true

      - run: pnpm run build
