name: Mac App Store build

# Manual for now (workflow_dispatch) — builds, signs, wraps into a .pkg,
# and (once HAS_APPSTORE_UPLOAD is set) uploads straight to App Store
# Connect via `xcrun altool`, using an API key (APPLE_API_KEY /
# APPLE_API_KEY_ID / APPLE_API_ISSUER repo secrets) — no Mac hardware
# needed anywhere, GitHub's macos-latest runner is a real Mac. Once
# there's an app record in App Store Connect this can be wired to run
# on `v*` tags too, same as release.yml.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect (untick for a rehearsal — full tests, build, sign and .pkg, no upload)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The whole CI suite (unit, E2E, DB drivers, cross-platform, command and
  # version consistency) must pass on this exact commit before anything
  # gets built, signed, or uploaded to Apple.
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versions in lockstep (App Store config overrides Cargo's)
        run: node scripts/check-versions.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - run: cargo install tauri-cli --version "^2" --locked

      - name: Import signing certs into a temporary keychain
        env:
          APPLE_DIST_CERTIFICATE: ${{ secrets.APPLE_DIST_CERTIFICATE }}
          APPLE_DIST_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DIST_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "$APPLE_DIST_CERTIFICATE" | base64 --decode > dist.p12
          security import dist.p12 -k build.keychain -P "$APPLE_DIST_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm dist.p12

          echo "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > installer.p12
          security import installer.p12 -k build.keychain -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm installer.p12

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        if: ${{ vars.HAS_PROVISIONING_PROFILE == 'true' }}
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/og-testdesk.provisionprofile"
          # Also drop a copy where tauri.macos-appstore.conf.json's
          # bundle.macOS.files expects it, so the bundler actually embeds
          # it as Contents/embedded.provisionprofile — installing it to
          # the OS's profile directory alone isn't enough; Apple's own
          # validation rejects an upload missing the embedded copy.
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode \
            > src-tauri/AppStore.provisionprofile

      - name: Build the sandboxed .app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DIST_SIGNING_IDENTITY }}
        run: |
          # CFBundleVersion (the internal build number, distinct from the
          # 0.2.0 marketing version) must strictly increase on every
          # upload, even a resubmission of the same version — Apple
          # rejects a duplicate outright. github.run_number is a simple,
          # always-incrementing value for exactly this.
          cargo tauri build \
            --target universal-apple-darwin \
            --config src-tauri/tauri.macos-appstore.conf.json \
            --config "{\"bundle\":{\"macOS\":{\"bundleVersion\":\"${{ github.run_number }}\"}}}" \
            --features app-store \
            --bundles app

      - name: Wrap into a signed .pkg (productbuild)
        env:
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          app_path=$(find target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$app_path" ]; then
            echo "::error::no .app bundle found under target/universal-apple-darwin/release/bundle/macos"
            exit 1
          fi
          echo "Found: $app_path"
          productbuild --component "$app_path" /Applications \
            --sign "$APPLE_INSTALLER_SIGNING_IDENTITY" \
            OGTestDesk-appstore.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: OGTestDesk-appstore-pkg
          path: OGTestDesk-appstore.pkg
          retention-days: 14

      - name: Upload to App Store Connect
        if: ${{ vars.HAS_APPSTORE_UPLOAD == 'true' && inputs.upload }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APPLE_API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          xcrun altool --upload-app \
            -f OGTestDesk-appstore.pkg \
            -t macos \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"
